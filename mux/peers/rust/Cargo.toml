[package]
name = "peer"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

# see mux/README.md "Build"
[dependencies]
yamux = "*"
async_smux = "*"
h2 = "*"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
bytes = "1"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"

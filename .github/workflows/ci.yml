name: ci

on:
  pull_request:
    # No `opened`: a non-draft open would race draft-guard and fire CI once before
    # it re-drafts. CI runs when a draft is marked ready (ready_for_review) or on a
    # push (synchronize). Drafts are skipped below regardless.
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

jobs:
  transport:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve ci/transport
        run: python3 transport/resolve ci/transport > ci/transport/resolved.json # see README "Runners"
      - id: bench
        uses: sw2m/bencher@3b05cbb3eae4a29b5c608135b4a0c4fa4d2cc61f # v0.4.0
        with:
          bench: ci/transport
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transport
          path: ${{ steps.bench.outputs.report }}
          if-no-files-found: warn

  socat:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve ci/socat
        run: python3 socat/resolve ci/socat > ci/socat/resolved.json # see README "Runners"
      - id: bench
        uses: sw2m/bencher@3b05cbb3eae4a29b5c608135b4a0c4fa4d2cc61f # v0.4.0
        with:
          bench: ci/socat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: socat
          path: ${{ steps.bench.outputs.report }}
          if-no-files-found: warn

  # The one status to mark required; checks join it through `needs` as they land
  mergeable:
    needs:
      - transport
      - socat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "transport=${{ needs.transport.result }} socat=${{ needs.socat.result }}"
          [ "${{ needs.transport.result }}" = success ]
          [ "${{ needs.socat.result }}" = success ]

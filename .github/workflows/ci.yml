name: ci

on:
  pull_request:
    # No `opened`: a non-draft open would race draft-guard and fire CI once before
    # it re-drafts. CI runs when a draft is marked ready (ready_for_review) or on a
    # push (synchronize). Drafts are skipped below regardless.
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

jobs:
  transport:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bench
        uses: sw2m/bencher@4957a77d6fe3ef2704ad0935425fcc64a3e764ab # v0.1.0
        with:
          bench: ci/bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transport
          path: ${{ steps.bench.outputs.report }}
          if-no-files-found: warn

  # The one status to mark required; checks join it through `needs` as they land
  mergeable:
    needs:
      - transport
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "transport=${{ needs.transport.result }}"
          [ "${{ needs.transport.result }}" = success ]
